name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify committed native library against its manifest
        run: scripts/build-native.sh --check
      - name: Self-test the quarantine ratchet gate
        run: tools/check-quarantine --self-test
      - run: mvn -B test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify the exported reference test tree
        run: tools/export-upstream --verify
      - name: Self-test the export verifier
        run: tools/export-upstream --self-test
      - run: mvn -B verify
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: |
            target/failsafe-reports/
            target/conformance-summary.txt
          if-no-files-found: warn

  quarantine-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify the exported reference test tree
        run: tools/export-upstream --verify
      - run: mvn -B verify -Dconformance.quarantine.enabled=false -Dmaven.test.failure.ignore=true
      - name: Fail when a quarantined method no longer fails
        run: tools/check-quarantine
      - name: Upload quarantine ratchet results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-ratchet
          path: |
            target/quarantine-ratchet.tsv
            target/failsafe-reports/
          if-no-files-found: warn

  xerial-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B -Pxerial-control verify
      - name: Upload reference probe results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xerial-control-results
          path: |
            target/failsafe-reports/
            target/conformance-summary.txt
          if-no-files-found: warn

  packaged-jar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B clean package -DskipTests
      - name: Verify the native library inside the jar
        run: |
          set -euo pipefail
          manifest=src/main/resources/io/github/magnusp/turso/native/linux-x86_64/native.properties
          expected="$(sed -n 's/^SO_SHA256=//p' "$manifest")"
          so_file="$(sed -n 's/^SO_FILE=//p' "$manifest")"
          jar="$(find target -maxdepth 1 -type f -name 'turso-jdbc-*.jar' | head -n 1)"
          test -n "$jar"
          actual="$(unzip -p "$jar" "io/github/magnusp/turso/native/linux-x86_64/$so_file" | sha256sum | awk '{print $1}')"
          echo "jar: $jar"
          echo "expected: $expected"
          echo "actual:   $actual"
          test "$actual" = "$expected"
      - name: Runtime smoke on glibc 2.35
        run: |
          set -euo pipefail
          jar="$(find target -maxdepth 1 -type f -name 'turso-jdbc-*.jar' | head -n 1)"
          cat > /tmp/TursoSmoke.java <<'EOF'
          import java.sql.Connection;
          import java.sql.DriverManager;
          import java.sql.ResultSet;
          import java.sql.Statement;

          public class TursoSmoke {
            public static void main(String[] args) throws Exception {
              try (Connection c = DriverManager.getConnection("jdbc:turso::memory:");
                  Statement s = c.createStatement();
                  ResultSet r = s.executeQuery("SELECT 1")) {
                if (!r.next() || r.getInt(1) != 1) {
                  throw new AssertionError("SELECT 1 failed");
                }
              }
              System.out.println(
                  "smoke ok, turso "
                      + io.github.magnusp.turso.core.TursoNative.version());
            }
          }
          EOF
          java --enable-native-access=ALL-UNNAMED -cp "$jar" /tmp/TursoSmoke.java
